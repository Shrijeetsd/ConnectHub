// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
        classpath("com.android.tools.build:gradle:8.3.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        configurations.classpath {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
                force "org.jetbrains.kotlin:kotlin-reflect:1.9.22"
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            // Force Namespace injection for libraries lacking it in AGP 8+
            if (project.android.namespace == null) {
                def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def xml = manifestFile.getText('UTF-8')
                    def matcher = xml =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        project.android.namespace = matcher.group(1)
                    }
                }
            }
            
            // Final fallback mapping for known problematic projects
            if (project.android.namespace == null) {
                if (project.name == "react-native-randombytes") project.android.namespace = "com.bitgo.randombytes"
                else if (project.name == "react-native-encrypted-storage") project.android.namespace = "com.emeraldsanto.encryptedstorage"
                else if (project.name == "react-native-get-sms-android") project.android.namespace = "com.react"
                else if (project.name == "react-native-vector-icons") project.android.namespace = "com.oblador.vectoricons"
                else if (project.name == "react-native-background-actions") project.android.namespace = "com.asterinet.react.bgactions"
                else if (project.name == "react-native-webview") project.android.namespace = "com.reactnativecommunity.webview"
                else project.android.namespace = "com." + project.name.replaceAll("-", ".")
            }

            // Force JVM 11 Consistency
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
            }
            
            // Direct task override (more robust than extension call)
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "11"
                }
            }
        }
    }
}
