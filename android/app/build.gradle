plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    // तुमचा युजर आयडी 'Rohan' असल्यामुळे आणि तुम्ही आधी सांगितल्याप्रमाणे पॅकेज नाव बदलले आहे
    namespace 'com.rohan.connecthub'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        // पॅकेज नाव 'com.rohan.connecthub' केल्यामुळे मॅनिफेस्ट क्रॅश थांबतील
        applicationId "com.rohan.connecthub"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:5000/api/\""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            buildConfigField "String", "BASE_URL", "\"https://connecthubapp.bond/api/\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'


    // Networking (Retrofit)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'

    // Security & Sync
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ✅ FIXED: WorkManager Kotlin Extension (यामुळे CoroutineWorker एरर निघून जाईल)
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    // Room Database - तुम्ही आधीच्या प्रोजेक्टमध्ये डेटा हाताळण्यासाठी हे वापरले असावे
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}