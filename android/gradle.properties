# AndroidX Support
android.useAndroidX=true
android.enableJetifier=true

# Gradle Configuration
org.gradle.configuration-cache=false
org.gradle.daemon=true

# JVM Args for Java 17 compatibility
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.desktop/sun.awt=ALL-UNNAMED

# Set the Gradle JDK to Android Studio's JBR (Java 17) - Trying this with Gradle 8.7
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Disable Kapt worker
kapt.use.worker.api=false